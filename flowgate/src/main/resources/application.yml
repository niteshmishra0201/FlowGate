server:
  port: 8080

spring:
  application:
    name: flowgate
  data:
    redis:
      host: redis     # container/service name — same DNS trick from Phase 0's bug fix
      port: 6379

flowgate:
  routes:
    - id: order-service
      path-pattern: "/orders/**"
      target-uri: "http://order-service:5678"
      health-check-path: "/"
    - id: dummy-backend
      path-pattern: "/**"
      target-uri: "http://dummy-backend:80"
      health-check-path: "/status/200"